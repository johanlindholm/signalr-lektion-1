<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat: svag hub (attackmål)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header>
      <h1>Chat <small style="font-weight:normal;color:var(--muted)">svag hub</small></h1>
      <span id="status" class="status status--off">Ej ansluten</span>
    </header>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <form id="send-form" class="send">
      <input id="username" type="text" placeholder="Ditt namn" autocomplete="off" required>
      <input id="message" type="text" placeholder="Meddelande till alla" autocomplete="off" required>
      <button type="submit">Skicka</button>
    </form>

    <form id="group-form" class="row">
      <input id="group" type="text" placeholder="Gruppnamn" autocomplete="off" required>
      <button type="submit" class="secondary">Gå med i grupp</button>
      <input id="group-message" type="text" placeholder="Meddelande till gruppen" autocomplete="off">
      <button type="button" id="send-group" class="secondary">Skicka till grupp</button>
    </form>
  </main>

  <script src="lib/signalr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
